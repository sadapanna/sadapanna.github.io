<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting… · Sadapanna Mind</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/styles.css?v=5" />
  <link rel="icon" href="/assets/brand/favicon.ico" sizes="any" />
  <!-- Legacy route. Articles now live at /mind/<slug>/ as static, indexable
       pages (built by scripts/build-posts.mjs). This forwards old
       /mind/post/?slug=… links to the new location. -->
  <script>
    (function () {
      var slug = new URLSearchParams(location.search).get("slug");
      var target = slug ? "/mind/" + encodeURIComponent(slug) + "/" : "/mind/";
      location.replace(target);
    })();
  </script>
</head>

<body>
  <main>
    <div class="container article">
      <p class="yard-loading">
        Taking you to the post… <a href="/mind/">Go to Mind →</a>
      </p>
    </div>
  </main>
</body>

</html>
